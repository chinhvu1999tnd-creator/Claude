<!--
  checklist.html — What's included checklist / curriculum overview
  Layout:     2-col grid · max-w-3xl · gap-3
  Background: var(--bg)
  Elements:   section label + H2 + check items (icon + title + optional sub-label)
  Visuals:    accent checkmark SVG · glass card wrapper
-->
<section class="py-24 bg-canvas">
  <div class="max-w-3xl mx-auto px-6">

    <div class="text-center mb-12 reveal">
      <span class="section-label">Bạn sẽ học được</span>
      <h2 class="font-display font-black text-ink" style="font-size:clamp(1.75rem,4vw,2.5rem);line-height:1.1;letter-spacing:-0.03em">Nội dung <span style="color:var(--accent)">đầy đủ</span></h2>
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 reveal">

      <div class="flex items-start gap-3 p-4 rounded-xl" style="background:var(--surface);border:1px solid rgba(255,255,255,0.07)">
        <div class="w-5 h-5 rounded-full flex items-center justify-center shrink-0 mt-0.5" style="background:rgba(182,255,0,0.12)">
          <svg width="10" height="10" viewBox="0 0 10 10" fill="none"><path d="M2 5l2 2 4-4" stroke="var(--accent)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <div>
          <p class="text-ink text-sm font-medium leading-snug">Checklist item 1</p>
          <p class="text-subtle text-xs mt-0.5">Sub-label tuỳ chọn</p>
        </div>
      </div>

      <div class="flex items-start gap-3 p-4 rounded-xl" style="background:var(--surface);border:1px solid rgba(255,255,255,0.07)">

        <div>

      <span class="text-sm font-medium text-ink">Tổng giá trị</span>
