<!--
  PATTERN: cta-strip
  THEME:   minimal-mono
  USAGE:   The ONLY black background section in this theme.
           Oversized white headline + inverted CTA button.
           Replace headline, subtext, button text, and href.
-->
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap');

  .mm-cta-strip {
    background: #111111;
    padding: 7rem 4rem;
  }

  .mm-cta-strip__inner {
    max-width: 900px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 3rem;
  }

  .mm-cta-strip__eyebrow {
    font-family: 'Space Mono', monospace;
    font-size: 0.7rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: #555555;
    margin: 0;
  }

  .mm-cta-strip__headline {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: clamp(2.5rem, 6vw, 5.5rem);
    line-height: 0.95;
    letter-spacing: -0.04em;
    color: #ffffff;
    margin: 0;
  }

  .mm-cta-strip__headline span {
    display: block;
  }

  .mm-cta-strip__bottom {
    display: flex;
    align-items: center;
    gap: 2.5rem;
    flex-wrap: wrap;
  }

  /* Primary CTA — inverted (white bg on black section) */
  .mm-cta-strip__btn {
    display: inline-block;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 500;
    font-size: 0.9rem;
    letter-spacing: 0.02em;
    color: #111111;
    background: #ffffff;
    border: 1px solid #ffffff;
    padding: 0.9rem 2.5rem;
    text-decoration: none;
    cursor: pointer;
    transition: background 0.2s ease, color 0.2s ease, border-color 0.2s ease;
  }

  .mm-cta-strip__btn:hover {
    background: transparent;
    color: #ffffff;
    border-color: #ffffff;
  }

  /* Secondary ghost link */
  .mm-cta-strip__link {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 0.875rem;
    font-weight: 400;
    color: #888888;
    text-decoration: underline;
    text-underline-offset: 4px;
    text-decoration-color: #444444;
    cursor: pointer;
    background: none;
    border: none;
    padding: 0;
    transition: color 0.2s ease;
  }

  .mm-cta-strip__link:hover {
    color: #ffffff;
    text-decoration-color: #888888;
  }

  /* Decorative sub-rule */
  .mm-cta-strip__rule {
    width: 100%;
    height: 1px;
    background: #222222;
    margin: 0;
  }

  @media (max-width: 768px) {
    .mm-cta-strip {
      padding: 5rem 1.5rem;
    }
    .mm-cta-strip__bottom {
      flex-direction: column;
      align-items: flex-start;
      gap: 1.5rem;
    }
  }
</style>

<section class="mm-cta-strip">
  <div class="mm-cta-strip__inner">
    <p class="mm-cta-strip__eyebrow">Next Step</p>

    <h2 class="mm-cta-strip__headline">
      <span>Ready to</span>
      <span>Build Your</span>
      <span>Brand?</span>
    </h2>

    <hr class="mm-cta-strip__rule">

    <div class="mm-cta-strip__bottom">
      <a href="#contact" class="mm-cta-strip__btn">Inquire Now</a>
      <a href="#services" class="mm-cta-strip__link">See Services First</a>
    </div>
  </div>
</section>
