<!--
  OVERRIDE: countdown-cta.html — Trust Navy
  vs shared: ticking countdown boxes · urgency headline
  Override: ENROLLMENT CLOSE DATE — calendar display thay clock ticking
  Layout change: Date display + deadline framing — professional, không hype
  Rule: Finance audience bị turn off bởi "đồng hồ đếm ngược" gimmick
        Dùng ngày cụ thể + reason why (cohort capacity) thay vì pressure countdown
-->
<section class="py-16" style="background:var(--surface)">
  <div class="max-w-4xl mx-auto px-6">

    <div style="border:1px solid var(--rim);border-radius:6px;overflow:hidden">

      <!-- Top gold bar -->
      <div class="h-0.5 w-full" style="background:var(--accent)"></div>

      <div class="grid sm:grid-cols-2 gap-0" style="background:var(--raised)">

        <!-- LEFT — calendar display -->
        <div class="p-8 flex flex-col justify-center" style="border-right:1px solid var(--faint)">

          <p class="font-mono text-[10px] uppercase tracking-widest mb-5" style="color:var(--subtle)">Enrollment deadline</p>

          <!-- Date display -->
          <div class="flex items-end gap-4 mb-5">
            <div class="text-center">
              <p class="font-mono font-bold leading-none mb-1" style="font-size:3.5rem;color:var(--accent)">[DD]</p>
              <p class="font-mono text-[10px] uppercase tracking-widest" style="color:var(--subtle)">[Month]</p>
            </div>
            <div class="mb-3">
              <p class="font-mono text-[10px] uppercase tracking-widest mb-1" style="color:var(--subtle)">Year</p>
              <p class="font-mono font-bold text-xl" style="color:var(--ink)">[YYYY]</p>
            </div>
          </div>

          <!-- Countdown as text — less aggressive -->
          <div class="flex items-center gap-2 px-3 py-2" style="background:rgba(201,168,76,0.06);border:1px solid var(--rim);border-radius:4px">
            <span class="relative flex h-1.5 w-1.5 flex-shrink-0">
              <span class="absolute inline-flex h-full w-full rounded-full opacity-60 animate-live" style="background:var(--accent)"></span>
              <span class="relative inline-flex h-1.5 w-1.5 rounded-full" style="background:var(--accent)"></span>
            </span>
            <p class="font-mono text-[10px] uppercase tracking-widest" style="color:var(--accent)" id="days-remaining">
              [N] days remaining
            </p>
          </div>

        </div>

        <!-- RIGHT — reason + CTA -->
        <div class="p-8 flex flex-col justify-center">

          <h2 class="font-display font-semibold mb-3"
              style="font-size:clamp(1.125rem,2.5vw,1.5rem);line-height:1.3;letter-spacing:-0.015em;color:var(--ink)">
            Cohort [N] — [Month YYYY]
          </h2>

          <p class="font-body text-sm leading-relaxed mb-6" style="color:var(--body)">
            Mỗi cohort giới hạn <strong style="color:var(--ink)">[N] học viên</strong> để đảm bảo chất lượng mentorship 1-1. Sau ngày [DATE], đăng ký đóng để chuẩn bị tài liệu và onboarding.
          </p>

          <div class="flex items-center gap-3 mb-5 p-3" style="background:var(--bg);border-radius:4px;border:1px solid var(--faint)">
            <p class="font-mono text-[10px] uppercase tracking-widest" style="color:var(--subtle)">Spots remaining</p>
            <p class="font-mono font-bold text-lg ml-auto" style="color:var(--accent)">[N] / [TOTAL]</p>
          </div>

          <a href="[ORDER_URL]"
             class="inline-flex items-center justify-center gap-2 py-3 px-7 font-body font-semibold text-sm transition-all hover:brightness-110"
             style="background:var(--accent);color:var(--accent-text);border-radius:4px">
            Apply for Cohort [N] →
          </a>

        </div>

      </div>
    </div>

  </div>
</section>

<script>
(function() {
  // Set enrollment deadline date — replace with actual date
  const deadline = new Date('[YYYY-MM-DD]T23:59:59');
  const now = new Date();
  const diffDays = Math.ceil((deadline - now) / 86400000);
  const el = document.getElementById('days-remaining');
  if (el && diffDays > 0) {
    el.textContent = diffDays + ' days remaining';
  } else if (el) {
    el.textContent = 'Enrollment closed';
    el.style.color = 'var(--alert)';
  }
})();
</script>
