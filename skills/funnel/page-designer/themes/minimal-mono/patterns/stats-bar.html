<!--
  PATTERN: stats-bar
  THEME:   minimal-mono
  USAGE:   Horizontal rule top + bottom, 4 stats inline, no cards.
           Pure typography — Space Mono numbers, grey labels below.
           Duplicate/remove .mm-stat items as needed.
-->
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500&family=Space+Mono:wght@400;700&display=swap');

  .mm-stats {
    background: #f8f8f8;
    border-top: 1px solid #111111;
    border-bottom: 1px solid #111111;
    padding: 3rem 4rem;
  }

  .mm-stats__grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 0;
    list-style: none;
    margin: 0;
    padding: 0;
  }

  .mm-stat {
    padding: 1.5rem 2rem 1.5rem 0;
    border-right: 1px solid #e0e0e0;
  }

  .mm-stat:last-child {
    border-right: none;
    padding-left: 2rem;
    padding-right: 0;
  }

  .mm-stat:not(:first-child) {
    padding-left: 2rem;
  }

  .mm-stat__number {
    font-family: 'Space Mono', monospace;
    font-weight: 700;
    font-size: clamp(1.8rem, 3.5vw, 3rem);
    color: #111111;
    line-height: 1;
    letter-spacing: -0.02em;
    display: block;
    margin: 0 0 0.5rem 0;
  }

  .mm-stat__label {
    font-family: 'Space Mono', monospace;
    font-weight: 400;
    font-size: 0.68rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: #888888;
    display: block;
  }

  @media (max-width: 768px) {
    .mm-stats {
      padding: 2.5rem 1.5rem;
    }
    .mm-stats__grid {
      grid-template-columns: repeat(2, 1fr);
      gap: 2rem 0;
    }
    .mm-stat {
      padding: 0 1.5rem 0 0;
    }
    .mm-stat:nth-child(2n) {
      border-right: none;
      padding-left: 1.5rem;
    }
    .mm-stat:nth-child(n+3) {
      border-top: 1px solid #e0e0e0;
      padding-top: 2rem;
    }
  }

  @media (max-width: 480px) {
    .mm-stats__grid {
      grid-template-columns: 1fr 1fr;
    }
  }
</style>

<section class="mm-stats" aria-label="Key statistics">
  <ul class="mm-stats__grid">
    <li class="mm-stat">
      <span class="mm-stat__number">47</span>
      <span class="mm-stat__label">Brands Built</span>
    </li>
    <li class="mm-stat">
      <span class="mm-stat__number">8yr</span>
      <span class="mm-stat__label">Experience</span>
    </li>
    <li class="mm-stat">
      <span class="mm-stat__number">$2M+</span>
      <span class="mm-stat__label">Revenue Generated</span>
    </li>
    <li class="mm-stat">
      <span class="mm-stat__number">12</span>
      <span class="mm-stat__label">Countries</span>
    </li>
  </ul>
</section>
