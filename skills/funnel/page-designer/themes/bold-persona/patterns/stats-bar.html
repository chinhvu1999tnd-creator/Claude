<!--
  PATTERN: stats-bar
  THEME:   bold-persona
  USE:     4 impact numbers on surface bg — huge Space Mono numbers, Inter labels
           Alternating coral/black numbers for visual energy
  Numbers: [N]K Followers · [N]+ Học viên · [N]M Doanh thu · [N]★ Rating
-->
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Inter:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

<style>
  :root {
    --accent: #e8533a; --electric: #1a56db;
    --bg: #ffffff; --surface: #f9fafb; --raised: #f3f4f6;
    --ink: #111827; --body: #374151; --subtle: #9ca3af; --faint: #e5e7eb;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  .stats-bar {
    background: var(--surface);
    border-top: 1px solid var(--faint);
    border-bottom: 1px solid var(--faint);
    padding: 56px 24px;
    position: relative;
    overflow: hidden;
  }
  /* Diagonal stripe texture */
  .stats-bar::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image: repeating-linear-gradient(
      45deg,
      transparent,
      transparent 24px,
      rgba(232,83,58,0.025) 24px,
      rgba(232,83,58,0.025) 25px
    );
    pointer-events: none;
  }

  .stats-inner {
    max-width: 1000px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 0;
    position: relative;
    z-index: 1;
  }

  .stat-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    padding: 20px 16px;
    position: relative;
  }
  /* Vertical divider */
  .stat-item:not(:last-child)::after {
    content: '';
    position: absolute;
    right: 0;
    top: 20%;
    height: 60%;
    width: 1px;
    background: var(--faint);
  }

  .stat-number {
    font-family: 'Space Mono', monospace;
    font-weight: 700;
    font-size: clamp(2rem, 4vw, 3.25rem);
    line-height: 1;
    letter-spacing: -0.02em;
    margin-bottom: 4px;
    display: flex;
    align-items: baseline;
    gap: 2px;
  }
  .stat-number.coral  { color: var(--accent); }
  .stat-number.dark   { color: var(--ink); }

  .stat-suffix {
    font-family: 'Inter', sans-serif;
    font-size: 0.5em;
    font-weight: 600;
    color: var(--subtle);
    letter-spacing: 0;
    padding-bottom: 2px;
  }

  .stat-slash {
    font-family: 'Inter', sans-serif;
    font-size: 0.68rem;
    font-weight: 500;
    color: var(--subtle);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin: 8px 0 6px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .stat-slash::before,
  .stat-slash::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--faint);
  }

  .stat-label {
    font-family: 'Inter', sans-serif;
    font-size: 0.8rem;
    font-weight: 500;
    color: var(--body);
    letter-spacing: 0.01em;
  }

  /* Scroll reveal */
  .stat-item {
    opacity: 0;
    transform: translateY(20px);
    transition: opacity 0.6s ease, transform 0.6s ease;
  }
  .stat-item.visible {
    opacity: 1;
    transform: translateY(0);
  }
  .stat-item:nth-child(1) { transition-delay: 0s; }
  .stat-item:nth-child(2) { transition-delay: 0.1s; }
  .stat-item:nth-child(3) { transition-delay: 0.2s; }
  .stat-item:nth-child(4) { transition-delay: 0.3s; }

  @media (max-width: 640px) {
    .stats-inner { grid-template-columns: repeat(2, 1fr); }
    .stat-item:nth-child(2)::after,
    .stat-item:nth-child(4)::after { display: none; }
    .stat-item:nth-child(1),
    .stat-item:nth-child(2) { padding-bottom: 28px; border-bottom: 1px solid var(--faint); }
    .stat-item:nth-child(3),
    .stat-item:nth-child(4) { padding-top: 28px; }
  }
</style>

<div class="stats-bar">
  <div class="stats-inner" id="statsGrid">

    <div class="stat-item">
      <div class="stat-number coral">
        [N]K
      </div>
      <div class="stat-slash">Tổng cộng</div>
      <div class="stat-label">Followers</div>
    </div>

    <div class="stat-item">
      <div class="stat-number dark">
        [N]+
      </div>
      <div class="stat-slash">Đã hoàn thành</div>
      <div class="stat-label">Học viên</div>
    </div>

    <div class="stat-item">
      <div class="stat-number coral">
        [N]M
      </div>
      <div class="stat-slash">Học viên tạo ra</div>
      <div class="stat-label">Doanh thu $</div>
    </div>

    <div class="stat-item">
      <div class="stat-number dark">
        [N]<span class="stat-suffix">★</span>
      </div>
      <div class="stat-slash">Đánh giá</div>
      <div class="stat-label">Rating</div>
    </div>

  </div>
</div>

<script>
  // Scroll reveal for stat items
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(e => {
      if (e.isIntersecting) {
        e.target.querySelectorAll('.stat-item').forEach(item => item.classList.add('visible'));
        observer.unobserve(e.target);
      }
    });
  }, { threshold: 0.3 });
  const grid = document.getElementById('statsGrid');
  if (grid) observer.observe(grid);
</script>
