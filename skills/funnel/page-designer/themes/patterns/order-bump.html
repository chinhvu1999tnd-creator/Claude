<!--
  order-bump.html — Checkbox upsell before payment
  Layout: 2-col · LEFT = [PRODUCT] image full height · RIGHT = checkbox + copy + price
  Slots: [PRODUCT] 4:3 or square — offer thumbnail (full card left column)
  Elements: Click-anywhere card · Inline checkbox · Label badge · Title · Description · Price strikethrough
  Rule: Chỉ 1 order bump, giá thấp hơn offer chính (10–30%)
  Vị trí: Ngay trên nút thanh toán
  Click behavior: onclick on entire card div → toggleBump() — không cần click đúng checkbox
-->
<div id="bump-card" class="rounded-xl overflow-hidden cursor-pointer select-none"
  style="background:rgba(var(--accent-rgb),.04);border:2px dashed rgba(var(--accent-rgb),.25);transition:background .2s,border-color .2s"
  onclick="toggleBump()">

  <div class="flex items-stretch">

    <!-- LEFT — Product image (full card height) -->
    <div class="shrink-0 relative media-slot" data-role="PRODUCT" style="width:7rem;min-height:120px;background:var(--surface);border:2px dashed var(--faint);display:flex;align-items:center;justify-content:center;">
      <!-- Replace: <img src="bump-offer.jpg" class="slot-img" alt="Tên offer"> -->
      <div class="absolute inset-0 flex flex-col items-center justify-center gap-1.5">
        <span style="font-size:2rem;opacity:0.35">📸</span>
        <p class="font-body text-xs font-medium" style="color:var(--subtle)">Offer thumbnail</p>
        <p class="font-body text-[10px]" style="color:var(--faint)">min 800px wide</p>
      </div>
    </div>

    <!-- RIGHT — Copy + checkbox -->
    <div class="flex-1 p-4 flex flex-col justify-center gap-2">

      <!-- Header row: checkbox + badge inline -->
      <div class="flex items-center gap-2">
        <!-- Checkbox visual -->
        <div id="bump-box" class="shrink-0 w-5 h-5 rounded flex items-center justify-center transition-all"
          style="background:rgba(var(--accent-rgb),.10);border:1.5px solid rgba(var(--accent-rgb),.35)">
          <svg id="bump-icon" class="hidden" width="12" height="12" viewBox="0 0 12 12" fill="none">
            <path d="M2 6l3 3 5-5" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <!-- Badge -->
        <span class="font-mono text-[9px] uppercase tracking-wider px-1.5 py-0.5 rounded"
          style="background:rgba(var(--accent-rgb),.15);color:var(--accent)">Thêm vào đơn</span>
      </div>

      <!-- Title -->
      <p class="font-display font-bold text-sm" style="color:var(--ink);line-height:1.3">
        Tên order bump — ít nhất 1 câu "tại sao cần"
      </p>

      <!-- Description -->
      <p class="font-body text-xs leading-relaxed" style="color:var(--body)">
        Mô tả ngắn 1–2 câu tại sao nên thêm thứ này. Nếu không thêm ngay bây giờ sẽ phải mua riêng với giá cao hơn 3×.
      </p>

      <!-- Price -->
      <div class="flex items-baseline gap-2">
        <span class="font-mono font-black text-sm" style="color:var(--accent)">+297.000đ</span>
        <span class="font-mono text-[10px] line-through" style="color:var(--subtle)">997.000đ</span>
      </div>

    </div>
  </div>
</div>

<script>
/* Standalone toggleBump — wire up IDs below to your summary column and submit button */
(function() {
  var bumped = false;
  window.toggleBump = function() {
    bumped = !bumped;
    var card  = document.getElementById('bump-card');
    var box   = document.getElementById('bump-box');
    var icon  = document.getElementById('bump-icon');

    /* Card border + bg */
    card.style.background   = bumped ? 'rgba(var(--accent-rgb),.09)' : 'rgba(var(--accent-rgb),.04)';
    card.style.borderColor  = bumped ? 'rgba(var(--accent-rgb),.5)'  : 'rgba(var(--accent-rgb),.25)';

    /* Checkbox visual */
    box.style.background    = bumped ? 'rgba(var(--accent-rgb),.2)'  : 'rgba(var(--accent-rgb),.10)';
    box.style.borderColor   = bumped ? 'var(--accent)'               : 'rgba(var(--accent-rgb),.35)';
    if (icon) icon.classList.toggle('hidden', !bumped);

    /* — Wire these to your page's summary / button elements — */
    /* document.getElementById('bump-summary-row').style.display = bumped ? 'flex' : 'none'; */
    /* document.getElementById('summary-total').textContent = bumped ? 'NEW_TOTAL' : 'BASE_TOTAL'; */
    /* document.getElementById('btn-label').textContent    = bumped ? 'Buy with bump' : 'Buy'; */
  };
})();
</script>
