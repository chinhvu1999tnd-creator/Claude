<!--
  OVERRIDE: announcement-bar.html — Warm Earth
  vs shared: neon/orange colored bg strip
  Override: terracotta bg + Caveat script accent + leaf SVG icon
-->
<div class="w-full py-2.5 px-6 flex items-center justify-center gap-3 flex-wrap relative overflow-hidden"
     style="background:var(--accent)">
  <!-- Linen texture -->
  <div class="absolute inset-0 pointer-events-none"
       style="background-image:repeating-linear-gradient(45deg,rgba(255,255,255,0.04) 0px,rgba(255,255,255,0.04) 1px,transparent 1px,transparent 8px)"></div>
  <div class="relative flex items-center gap-2.5">
    <!-- Leaf icon -->
    <svg width="14" height="14" viewBox="0 0 14 14" fill="none" class="flex-shrink-0">
      <path d="M2 12C2 12 3 6 7 4C11 2 13 5 12 9C11 11 9 12.5 6 12.5" stroke="rgba(255,255,255,0.8)" stroke-width="1.4" stroke-linecap="round"/>
      <path d="M6 12.5L5 10" stroke="rgba(255,255,255,0.8)" stroke-width="1.4" stroke-linecap="round"/>
    </svg>
    <p class="font-display font-bold text-sm text-white">[OFFER TEXT — e.g. 🌿 Ưu đãi khai trương — Giảm 30% đơn đầu tiên]</p>
  </div>
  <a href="[CTA_URL]" class="font-display font-semibold text-sm underline underline-offset-2 transition-opacity hover:opacity-75"
     style="color:rgba(255,255,255,0.9)">Mua ngay →</a>
</div>
