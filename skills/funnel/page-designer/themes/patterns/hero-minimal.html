<!--
  PATTERN: Hero Minimal
  Use: Warm traffic / retargeting / short sales letter — no visual noise
  Brief: Layout=narrow centered · Background=canvas plain · Elements=eyebrow+H1+sub+single CTA
-->
<section class="pt-24 pb-20 px-6" style="background:var(--bg);">
  <div class="max-w-2xl mx-auto text-center">
    <p class="section-label mb-6" style="justify-content:center;">[EYEBROW — e.g. Dành cho ai đã biết mình cần cái này]</p>
    <h1 class="font-display font-black text-ink mb-5 reveal" style="font-size:clamp(2rem,4.5vw,3.5rem);line-height:1.08;letter-spacing:-0.03em;">
      [HEADLINE — direct, no gradient needed]
    </h1>
    <p class="text-subtle text-xl leading-relaxed max-w-lg mx-auto mb-8 reveal" style="transition-delay:.08s;">[Subheadline]</p>
    <a href="order.html" class="btn-glow inline-flex items-center gap-2 font-display font-bold text-base px-9 py-4 rounded-btn min-h-[52px] cursor-pointer transition-all duration-200 reveal" style="background:var(--accent);color:var(--bg);transition-delay:.14s;">
      [CTA] →
    </a>
    <p class="text-faint text-xs font-ui mt-4">[Urgency / guarantee line]</p>
  </div>
</section>
