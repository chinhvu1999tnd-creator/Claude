<!--
  OVERRIDE: countdown-cta.html — Dark Bold Neon
  vs shared: surface/border timer boxes, accent on seconds only
  Override: ALL boxes have neon border glow + seconds box pulses + grid bg + dramatic urgency
  Visual:   launch-sequence terminal vs. clean countdown
-->
<section class="relative py-20 overflow-hidden" style="background:var(--bg)">
  <!-- Grid overlay -->
  <div class="absolute inset-0 pointer-events-none"
       style="background-image:linear-gradient(rgba(182,255,0,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(182,255,0,.025) 1px,transparent 1px);background-size:40px 40px"></div>
  <!-- Radial glow top -->
  <div class="absolute inset-0 pointer-events-none"
       style="background:radial-gradient(ellipse 70% 40% at 50% 0%,rgba(182,255,0,0.12) 0%,transparent 70%)"></div>

  <div class="relative max-w-2xl mx-auto px-6 text-center">

    <!-- Urgency label -->
    <div class="flex items-center justify-center gap-2 mb-6">
      <span class="relative flex h-2.5 w-2.5">
        <span class="absolute inline-flex h-full w-full rounded-full opacity-75 animate-ping" style="background:var(--accent)"></span>
        <span class="relative inline-flex h-2.5 w-2.5 rounded-full" style="background:var(--accent)"></span>
      </span>
      <p class="font-mono text-[10px] uppercase tracking-[0.14em] font-bold" style="color:var(--accent)">Ưu đãi kết thúc sau</p>
    </div>

    <!-- Countdown boxes — all glowing -->
    <div class="flex items-center justify-center gap-3 mb-10" id="countdown-display">

      <div class="flex flex-col items-center">
        <div class="w-18 h-18 sm:w-22 sm:h-22 flex items-center justify-center font-mono font-black rounded-xl"
             style="width:72px;height:72px;font-size:clamp(1.75rem,4vw,2.25rem);
                    background:var(--surface);
                    border:1px solid rgba(182,255,0,0.25);
                    box-shadow:0 0 20px rgba(182,255,0,0.12),inset 0 0 12px rgba(182,255,0,0.04);
                    color:var(--ink)"
             id="cd-days">02</div>
        <span class="font-mono text-[9px] uppercase tracking-[0.1em] mt-2" style="color:var(--subtle)">Ngày</span>
      </div>

      <span class="font-mono text-xl font-black mb-5" style="color:rgba(182,255,0,0.4)">:</span>

      <div class="flex flex-col items-center">
        <div class="w-18 h-18 sm:w-22 sm:h-22 flex items-center justify-center font-mono font-black rounded-xl"
             style="width:72px;height:72px;font-size:clamp(1.75rem,4vw,2.25rem);
                    background:var(--surface);
                    border:1px solid rgba(182,255,0,0.25);
                    box-shadow:0 0 20px rgba(182,255,0,0.12),inset 0 0 12px rgba(182,255,0,0.04);
                    color:var(--ink)"
             id="cd-hours">23</div>
        <span class="font-mono text-[9px] uppercase tracking-[0.1em] mt-2" style="color:var(--subtle)">Giờ</span>
      </div>

      <span class="font-mono text-xl font-black mb-5" style="color:rgba(182,255,0,0.4)">:</span>

      <div class="flex flex-col items-center">
        <div class="w-18 h-18 sm:w-22 sm:h-22 flex items-center justify-center font-mono font-black rounded-xl"
             style="width:72px;height:72px;font-size:clamp(1.75rem,4vw,2.25rem);
                    background:var(--surface);
                    border:1px solid rgba(182,255,0,0.25);
                    box-shadow:0 0 20px rgba(182,255,0,0.12),inset 0 0 12px rgba(182,255,0,0.04);
                    color:var(--ink)"
             id="cd-mins">59</div>
        <span class="font-mono text-[9px] uppercase tracking-[0.1em] mt-2" style="color:var(--subtle)">Phút</span>
      </div>

      <span class="font-mono text-xl font-black mb-5" style="color:rgba(182,255,0,0.4)">:</span>

      <!-- Seconds — fully glowing neon -->
      <div class="flex flex-col items-center">
        <div class="w-18 h-18 sm:w-22 sm:h-22 flex items-center justify-center font-mono font-black rounded-xl"
             style="width:72px;height:72px;font-size:clamp(1.75rem,4vw,2.25rem);
                    background:rgba(182,255,0,0.08);
                    border:1px solid rgba(182,255,0,0.5);
                    box-shadow:0 0 30px rgba(182,255,0,0.3),0 0 60px rgba(182,255,0,0.12),inset 0 0 20px rgba(182,255,0,0.06);
                    color:var(--accent);
                    text-shadow:0 0 16px rgba(182,255,0,0.6)"
             id="cd-secs">00</div>
        <span class="font-mono text-[9px] uppercase tracking-[0.1em] mt-2" style="color:var(--accent)">Giây</span>
      </div>

    </div>

    <h2 class="font-display font-black text-ink mb-3"
        style="font-size:clamp(1.5rem,3.5vw,2.25rem);line-height:1.05;letter-spacing:-0.04em">
      Đừng bỏ lỡ ưu đãi này
    </h2>
    <p class="font-body text-sm mb-8" style="color:var(--subtle)">Giá tăng trở lại sau khi đồng hồ về 0.</p>

    <a href="#checkout"
       class="inline-flex items-center gap-2 py-4 px-10 rounded-xl font-display font-black text-sm transition-all hover:brightness-110 hover:scale-[1.02]"
       style="background:var(--accent);color:#0d0d0c;box-shadow:0 4px 30px rgba(182,255,0,0.4)">
      Đăng ký ngay với giá ưu đãi
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M3 7h8M7.5 4l3 3-3 3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>

  </div>
</section>

<script>
(function() {
  const deadline = new Date(Date.now() + 2 * 24 * 60 * 60 * 1000);
  function tick() {
    const diff = deadline - Date.now();
    if (diff <= 0) return;
    const d = Math.floor(diff / 86400000);
    const h = Math.floor((diff % 86400000) / 3600000);
    const m = Math.floor((diff % 3600000) / 60000);
    const s = Math.floor((diff % 60000) / 1000);
    document.getElementById('cd-days').textContent = String(d).padStart(2,'0');
    document.getElementById('cd-hours').textContent = String(h).padStart(2,'0');
    document.getElementById('cd-mins').textContent = String(m).padStart(2,'0');
    document.getElementById('cd-secs').textContent = String(s).padStart(2,'0');
  }
  tick();
  setInterval(tick, 1000);
})();
</script>
