<!--
  badge-row.html — Trust badges / credential icons row
  Layout:     flex wrap · centered · gap-3 · max-w-3xl
  Background: var(--bg)
  Elements:   3-6 badge pills (icon + label)
  Visuals:    icon + label pills with glass styling · monospace font
-->
<section class="py-10 bg-canvas">
  <div class="max-w-3xl mx-auto px-6 reveal">
    <div class="flex flex-wrap items-center justify-center gap-3">

      <div class="flex items-center gap-2 px-4 py-2.5 rounded-full" style="background:var(--surface);border:1px solid rgba(255,255,255,0.08)">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M7 1L2 3.5v4C2 10 3.8 11.5 6 12c.7-.2 1.3-.5 1-.3 2.2-.5 4-2 4-4.5v-4L7 1z" stroke="var(--accent)" stroke-width="1.2" stroke-linejoin="round"/></svg>
        <span class="text-xs font-mono text-subtle">Bảo mật SSL</span>
      </div>

      <div class="flex items-center gap-2 px-4 py-2.5 rounded-full" style="background:var(--surface);border:1px solid rgba(255,255,255,0.08)">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><circle cx="7" cy="7" r="6" stroke="var(--accent)" stroke-width="1.2"/><path d="M4.5 7l2 2 3-3" stroke="var(--accent)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span class="text-xs font-mono text-subtle">Hoàn tiền 7 ngày</span>
      </div>

      <div class="flex items-center gap-2 px-4 py-2.5 rounded-full" style="background:var(--surface);border:1px solid rgba(255,255,255,0.08)">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M1 7h12M7 1v12" stroke="var(--accent)" stroke-width="1.2" stroke-linecap="round"/></svg>
        <span class="text-xs font-mono text-subtle">2,400+ học viên</span>
      </div>

      <div class="flex items-center gap-2 px-4 py-2.5 rounded-full" style="background:var(--surface);border:1px solid rgba(255,255,255,0.08)">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><circle cx="7" cy="5.5" r="2.5" stroke="var(--accent)" stroke-width="1.2"/><path d="M2 12.5c0-3 2.24-5 5-5s5 2 5 5" stroke="var(--accent)" stroke-width="1.2" stroke-linecap="round"/></svg>
        <span class="text-xs font-mono text-subtle">Giảng viên thực chiến</span>
      </div>

      <div class="flex items-center gap-2 px-4 py-2.5 rounded-full" style="background:var(--surface);border:1px solid rgba(255,255,255,0.08)">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><rect x="2" y="2" width="10" height="10" rx="2" stroke="var(--accent)" stroke-width="1.2"/><path d="M5 7l2 2 2-3" stroke="var(--accent)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span class="text-xs font-mono text-subtle">Truy cập trọn đời</span>
      </div>

      <div class="flex items-center gap-2 px-4 py-2.5 rounded-full" style="background:var(--surface);border:1px solid rgba(255,255,255,0.08)">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M7 1l1.5 3 3.5.5-2.5 2.5.5 3.5L7 9l-3 1.5.5-3.5L2 4.5 5.5 4 7 1z" stroke="var(--accent)" stroke-width="1.2" stroke-linejoin="round"/></svg>
        <span class="text-xs font-mono text-subtle">Rating 4.9/5</span>
      </div>

    </div>
  </div>
</section>
