<!--
  PATTERN: Stats Bar — Energy Sport Theme
  Dark surface, 4 bold metric blocks, large Barlow Condensed numbers,
  red/yellow accents, grey labels UPPERCASE, vertical red dividers
-->
<style>
  :root {
    --accent:      #ff2d2d;
    --yellow:      #f5c500;
    --bg:          #0e0e0e;
    --surface:     #141414;
    --faint:       #2a2a2a;
    --ink:         #ffffff;
    --body:        #cccccc;
    --subtle:      #888888;
    --font-display:'Barlow Condensed', sans-serif;
    --font-body:   'Barlow', sans-serif;
    --font-label:  'Barlow Semi Condensed', sans-serif;
  }

  @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;900&family=Barlow:wght@400&family=Barlow+Semi+Condensed:wght@600;700&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  .stats-bar {
    background-color: var(--surface);
    background-image: repeating-linear-gradient(
      -45deg,
      rgba(255,255,255,0.025) 0px,
      rgba(255,255,255,0.025) 1px,
      transparent 1px,
      transparent 8px
    );
    border-top: 1px solid var(--faint);
    border-bottom: 1px solid var(--faint);
    padding: 48px 40px;
  }

  .stats-bar__inner {
    max-width: 1200px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 0;
  }

  .stat-block {
    text-align: center;
    padding: 16px 32px;
    position: relative;
  }

  /* Vertical red divider between blocks */
  .stat-block + .stat-block::before {
    content: '';
    position: absolute;
    left: 0;
    top: 15%;
    height: 70%;
    width: 1px;
    background: linear-gradient(to bottom, transparent, var(--accent), transparent);
    opacity: 0.5;
  }

  .stat-block__prefix {
    font-family: var(--font-display);
    font-weight: 900;
    font-size: 1.5rem;
    vertical-align: super;
    line-height: 1;
  }

  .stat-block__number {
    font-family: var(--font-display);
    font-weight: 900;
    font-size: clamp(3rem, 6vw, 5.5rem);
    line-height: 1;
    letter-spacing: -0.02em;
    color: var(--ink);
    display: block;
  }

  .stat-block__suffix {
    font-family: var(--font-display);
    font-weight: 900;
    font-size: 2.5rem;
    vertical-align: baseline;
    line-height: 1;
  }

  /* Color variants */
  .stat-block--red .stat-block__number,
  .stat-block--red .stat-block__prefix,
  .stat-block--red .stat-block__suffix { color: var(--accent); }

  .stat-block--yellow .stat-block__number,
  .stat-block--yellow .stat-block__prefix,
  .stat-block--yellow .stat-block__suffix { color: var(--yellow); }

  .stat-block--white .stat-block__number,
  .stat-block--white .stat-block__prefix,
  .stat-block--white .stat-block__suffix { color: var(--ink); }

  .stat-block__label {
    font-family: var(--font-label);
    font-weight: 700;
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    color: var(--subtle);
    margin-top: 8px;
    display: block;
    line-height: 1.3;
  }

  .stat-block__sublabel {
    font-family: var(--font-body);
    font-weight: 400;
    font-size: 0.78rem;
    color: var(--subtle);
    margin-top: 4px;
    display: block;
    opacity: 0.7;
  }

  /* Decorative accent line below number */
  .stat-block__accent-line {
    display: block;
    width: 32px;
    height: 3px;
    background: currentColor;
    margin: 8px auto 0;
    transform: skewX(-15deg);
  }
  .stat-block--red  .stat-block__accent-line { color: var(--accent); }
  .stat-block--yellow .stat-block__accent-line { color: var(--yellow); }
  .stat-block--white  .stat-block__accent-line { color: rgba(255,255,255,0.3); }

  /* ── VARIANT: Horizontal marquee ────────────── */
  .stats-bar--marquee { overflow: hidden; }
  .stats-bar--marquee .stats-bar__inner {
    display: flex;
    animation: marqueeScroll 30s linear infinite;
    width: max-content;
  }
  @keyframes marqueeScroll {
    0%   { transform: translateX(0); }
    100% { transform: translateX(-50%); }
  }

  /* ── RESPONSIVE ─────────────────────────────── */
  @media (max-width: 768px) {
    .stats-bar__inner { grid-template-columns: repeat(2, 1fr); }
    .stat-block { padding: 20px 16px; }
  }

  @media (max-width: 480px) {
    .stats-bar__inner { grid-template-columns: 1fr 1fr; }
  }
</style>

<!-- DEFAULT: 4-block stats bar -->
<section class="stats-bar">
  <div class="stats-bar__inner">

    <div class="stat-block stat-block--red">
      <span class="stat-block__number">2,400<span class="stat-block__suffix">+</span></span>
      <span class="stat-block__accent-line"></span>
      <span class="stat-block__label">Active Members</span>
    </div>

    <div class="stat-block stat-block--white">
      <span class="stat-block__number">87<span class="stat-block__suffix">%</span></span>
      <span class="stat-block__accent-line"></span>
      <span class="stat-block__label">Achieve Their Goal</span>
      <span class="stat-block__sublabel">Within 90 days</span>
    </div>

    <div class="stat-block stat-block--yellow">
      <span class="stat-block__number">12</span>
      <span class="stat-block__accent-line"></span>
      <span class="stat-block__label">Expert Coaches</span>
      <span class="stat-block__sublabel">Certified trainers</span>
    </div>

    <div class="stat-block stat-block--white">
      <span class="stat-block__number">24<span class="stat-block__suffix">/7</span></span>
      <span class="stat-block__accent-line"></span>
      <span class="stat-block__label">Always Open</span>
      <span class="stat-block__sublabel">365 days a year</span>
    </div>

  </div>
</section>
