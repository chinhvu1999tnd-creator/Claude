<!--
  PATTERN: hero
  THEME: clean-clinic
  USE: Primary hero section — 2-column split layout
  LEFT: Headline, sub, CTA, trust strip
  RIGHT: Before/after image slot or doctor image
-->
<style>
  :root {
    --accent: #0fa37f;
    --accent-rgb: 15, 163, 127;
    --accent-text: #ffffff;
    --blue: #2563eb;
    --alert: #dc2626;
    --positive: #16a34a;
    --bg: #f8fffe;
    --surface: #f0faf8;
    --raised: #e6f7f4;
    --ink: #0d2b24;
    --body: #1f5c4e;
    --subtle: #5a8f85;
    --faint: #c8e8e3;
    --rim: rgba(15,163,127,0.18);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', system-ui, sans-serif; background: var(--bg); }

  .hero-section {
    background: var(--bg);
    padding: 80px 24px;
    position: relative;
    overflow: hidden;
  }
  /* Subtle radial teal glow — top right */
  .hero-section::before {
    content: '';
    position: absolute;
    top: -100px;
    right: -100px;
    width: 600px;
    height: 600px;
    background: radial-gradient(circle, rgba(15,163,127,0.08) 0%, transparent 70%);
    pointer-events: none;
  }

  .hero-container {
    max-width: 1140px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 64px;
    align-items: center;
    position: relative;
    z-index: 1;
  }

  /* Eyebrow badge */
  .eyebrow-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: transparent;
    border: 1.5px solid var(--accent);
    border-radius: 99px;
    padding: 5px 14px;
    font-size: 0.75rem;
    font-weight: 600;
    color: var(--accent);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 20px;
  }

  /* Headline */
  .hero-headline {
    font-size: clamp(2.25rem, 5vw, 3.5rem);
    font-weight: 800;
    color: var(--ink);
    line-height: 1.1;
    margin-bottom: 20px;
    font-family: 'Inter', sans-serif;
  }
  .hero-headline span { color: var(--accent); }

  /* Sub */
  .hero-sub {
    font-size: 1.125rem;
    font-weight: 400;
    color: var(--body);
    line-height: 1.7;
    margin-bottom: 36px;
    max-width: 480px;
  }

  /* CTA row */
  .cta-row {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 40px;
  }
  .btn-primary {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 14px 28px;
    font-size: 1rem;
    font-weight: 600;
    font-family: 'Inter', sans-serif;
    cursor: pointer;
    transition: background 0.2s ease, box-shadow 0.2s ease;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }
  .btn-primary:hover { background: #0d9270; box-shadow: 0 4px 16px rgba(15,163,127,0.30); }
  .btn-ghost {
    background: transparent;
    color: var(--accent);
    border: 2px solid var(--accent);
    border-radius: 8px;
    padding: 12px 26px;
    font-size: 1rem;
    font-weight: 600;
    font-family: 'Inter', sans-serif;
    cursor: pointer;
    transition: background 0.2s ease;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }
  .btn-ghost:hover { background: var(--surface); }

  /* Trust strip */
  .trust-strip {
    display: flex;
    flex-wrap: wrap;
    gap: 20px;
    align-items: center;
    padding-top: 20px;
    border-top: 1px solid var(--faint);
  }
  .trust-item {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.875rem;
    color: var(--subtle);
    font-weight: 500;
  }
  .trust-item strong { color: var(--body); }

  /* Image slot */
  .hero-visual {
    position: relative;
  }
  .before-after-pair {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    border-radius: 16px;
    overflow: hidden;
  }
  .ba-panel {
    border-radius: 12px;
    overflow: hidden;
    position: relative;
  }
  .ba-panel.before {
    background: #f4f4f5;
    border: 1px solid #e4e4e7;
  }
  .ba-panel.after {
    background: var(--surface);
    border: 1px solid var(--faint);
  }
  .ba-label {
    position: absolute;
    top: 10px;
    left: 10px;
    font-size: 0.7rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    padding: 3px 10px;
    border-radius: 99px;
  }
  .ba-panel.before .ba-label { background: #e4e4e7; color: #71717a; }
  .ba-panel.after .ba-label { background: var(--raised); color: var(--accent); }

  @media (max-width: 768px) {
    .hero-container { grid-template-columns: 1fr; gap: 40px; }
    .hero-visual { order: -1; }
    .before-after-pair { max-width: 400px; margin: 0 auto; }
  }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
