<!--
  ty-community.html — Join community (post-purchase)
  Layout:     centered · max-w-xl · card với platform icons
  Elements:   Headline · Platform badges · Primary join CTA · Member count proof
  Rule:       Chỉ 1 community chính — không liệt kê 3–4 nơi cùng lúc
              Ưu tiên: Zalo Group > Facebook Group > Discord > Telegram
  Dùng cho:   Post-purchase — bước sau ty-access.html
-->
<div class="max-w-xl mx-auto px-6 pb-10">
  <div class="rounded-xl p-6 text-center" style="background:var(--surface);border:1px solid var(--rim)">

    <!-- Icon -->
    <div class="w-12 h-12 rounded-xl flex items-center justify-center mx-auto mb-4"
      style="background:rgba(var(--cyan-rgb),.10);border:1px solid rgba(var(--cyan-rgb),.2)">
      <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
        <path d="M17 8A6 6 0 115 8c0 4.5 6 10 6 10s6-5.5 6-10z" stroke="var(--cyan)" stroke-width="1.4"/>
        <circle cx="11" cy="8" r="2" stroke="var(--cyan)" stroke-width="1.4"/>
      </svg>
    </div>

    <h3 class="font-display font-bold text-ink mb-1" style="font-size:1.1875rem;letter-spacing:-0.015em">
      Tham gia cộng đồng
    </h3>
    <p class="font-body text-sm mb-5" style="color:var(--body);line-height:1.6">
      Hỏi đáp, chia sẻ kết quả, nhận hỗ trợ từ team và cộng đồng —
      đây là nơi anh/chị sẽ tiến nhanh nhất.
    </p>

    <!-- Member proof -->
    <div class="inline-flex items-center gap-2 px-3 py-1.5 rounded-full mb-5"
      style="background:rgba(var(--cyan-rgb),.08);border:1px solid rgba(var(--cyan-rgb),.18)">
      <div class="flex -space-x-1.5">
        <div class="w-5 h-5 rounded-full" style="background:rgba(var(--accent-rgb),.3);border:1.5px solid var(--surface)"></div>
        <div class="w-5 h-5 rounded-full" style="background:rgba(var(--cyan-rgb),.3);border:1.5px solid var(--surface)"></div>
        <div class="w-5 h-5 rounded-full" style="background:rgba(var(--purple-rgb),.3);border:1.5px solid var(--surface)"></div>
      </div>
      <span class="font-mono text-[10px]" style="color:var(--cyan)">[X] thành viên đang hoạt động</span>
    </div>

    <!-- Primary CTA -->
    <a href="[COMMUNITY_URL]"
      class="inline-flex items-center justify-center gap-2.5 w-full py-3.5 px-5 rounded-btn font-display font-bold text-sm mb-3 transition-all"
      style="background:rgba(var(--cyan-rgb),.12);color:var(--cyan);border:1px solid rgba(var(--cyan-rgb),.3);text-decoration:none">
      <!-- Zalo icon -->
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
        <rect x="1" y="1" width="16" height="16" rx="4" stroke="currentColor" stroke-width="1.3"/>
        <path d="M5 12V7.5a2.5 2.5 0 015 0V12M5 9.5h5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
        <path d="M12 7l2 2.5-2 2.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Vào nhóm Zalo ngay
    </a>

    <!-- [OPTIONAL: Facebook Group fallback] — uncomment nếu dùng FB Group thay / bổ sung
    <a href="[FB_GROUP_URL]"
      class="inline-flex items-center justify-center gap-2 w-full py-2.5 px-5 rounded-btn font-mono text-[11px] transition-all"
      style="color:var(--subtle);border:1px solid var(--rim);text-decoration:none">
      Hoặc tham gia Facebook Group
    </a>
    END [OPTIONAL] -->

  </div>
</div>
