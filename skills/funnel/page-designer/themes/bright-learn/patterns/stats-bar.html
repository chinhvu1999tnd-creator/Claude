<!--
  OVERRIDE: stats-bar.html — Bright Learn
  vs shared: dark raised cards + neon metric glow + scanlines
  Override: white cards on light-purple surface + colored numbers + soft shadow
  Layout: cùng 4-col grid — visual treatment khác hoàn toàn
-->
<section class="py-10" style="background:var(--surface)">
  <div class="max-w-4xl mx-auto px-6">
    <div class="grid grid-cols-2 sm:grid-cols-4 gap-1">

      <!-- Stat 1 -->
      <div class="text-center py-5 px-4">
        <p class="font-display font-extrabold leading-none mb-1.5"
           style="font-size:clamp(1.75rem,4vw,2.5rem);color:var(--accent)">[STAT 1]</p>
        <p class="font-body text-sm" style="color:var(--subtle)">[Label 1]</p>
      </div>

      <!-- Stat 2 -->
      <div class="text-center py-5 px-4" style="border-left:1px solid var(--faint)">
        <p class="font-display font-extrabold leading-none mb-1.5"
           style="font-size:clamp(1.75rem,4vw,2.5rem);color:var(--teal)">[STAT 2]</p>
        <p class="font-body text-sm" style="color:var(--subtle)">[Label 2]</p>
      </div>

      <!-- Stat 3 -->
      <div class="text-center py-5 px-4" style="border-left:1px solid var(--faint)">
        <p class="font-display font-extrabold leading-none mb-1.5"
           style="font-size:clamp(1.75rem,4vw,2.5rem);color:var(--accent)">[STAT 3]</p>
        <p class="font-body text-sm" style="color:var(--subtle)">[Label 3]</p>
      </div>

      <!-- Stat 4 -->
      <div class="text-center py-5 px-4" style="border-left:1px solid var(--faint)">
        <p class="font-display font-extrabold leading-none mb-1.5"
           style="font-size:clamp(1.75rem,4vw,2.5rem);color:var(--orange)">[STAT 4]</p>
        <p class="font-body text-sm" style="color:var(--subtle)">[Label 4]</p>
      </div>

    </div>
  </div>
</section>
