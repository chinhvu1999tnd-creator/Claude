<!--
  ty-download.html — Direct download / immediate access (lead magnet)
  Layout:     centered · max-w-xl
  Elements:   File info card · Download button · Format + size note
  Rule:       Dùng khi có file tải thẳng (PDF, ZIP...). Nếu gửi qua email thì dùng ty-leadmag-header thay thế.
              Đặt ngay dưới ty-leadmag-header.html như option bổ sung.
  Dùng cho:   Lead magnet có file download trực tiếp
-->
<div class="max-w-xl mx-auto px-6 pb-8">
  <div class="rounded-xl p-5 flex items-center gap-4" style="background:var(--surface);border:1px solid rgba(var(--accent-rgb),.2)">

    <!-- File icon -->
    <div class="shrink-0 w-12 h-12 rounded-lg flex items-center justify-center"
      style="background:rgba(var(--accent-rgb),.10);border:1px solid rgba(var(--accent-rgb),.2)">
      <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
        <path d="M13 2H6a2 2 0 00-2 2v14a2 2 0 002 2h10a2 2 0 002-2V9l-5-7z" stroke="var(--accent)" stroke-width="1.4" stroke-linejoin="round"/>
        <path d="M13 2v7h7" stroke="var(--accent)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M11 13v4M9 15l2 2 2-2" stroke="var(--accent)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>

    <!-- File info -->
    <div class="flex-1 min-w-0">
      <p class="font-body font-semibold text-sm text-ink truncate">[Tên lead magnet].[pdf/zip/...]</p>
      <p class="font-mono text-[10px] mt-0.5" style="color:var(--subtle)">[Định dạng] · [Dung lượng] · Miễn phí</p>
    </div>

    <!-- Download button -->
    <a href="[DOWNLOAD_URL]" download
      class="btn-glow shrink-0 flex items-center gap-1.5 py-2 px-3.5 rounded-btn font-display font-bold text-sm"
      style="background:var(--accent);color:var(--bg);text-decoration:none;white-space:nowrap">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
        <path d="M7 2v7M4 6.5l3 3 3-3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M2 11h10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      Tải xuống
    </a>

  </div>
</div>
