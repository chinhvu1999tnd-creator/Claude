<!--
  order-header.html — Minimal checkout header (NO navigation)
  Rule: Không có nav links — không có escape route khỏi checkout
  Elements: Logo left · Progress indicator center · Security badge right
  Background: bg-canvas border-bottom
-->
<header style="position:sticky;top:0;z-index:50;background:rgba(var(--bg-rgb),.96);border-bottom:1px solid var(--rim);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)">
  <div class="max-w-4xl mx-auto px-6 h-14 flex items-center justify-between">

    <!-- Logo — link về home nhưng không nổi bật -->
    <a href="/" class="flex items-center gap-2 font-mono font-bold text-sm" style="color:var(--accent);opacity:.85">
      <svg width="18" height="18" viewBox="0 0 20 20" fill="none"><rect width="20" height="20" rx="4" style="fill:rgba(var(--accent-rgb),.15)"/><path d="M5 10h3l2-5 2 10 2-5h1" stroke="var(--accent)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Brand Name
    </a>

    <!-- Progress steps -->
    <div class="hidden sm:flex items-center gap-2 font-mono text-xs">
      <span class="px-2.5 py-1 rounded-full" style="background:var(--accent);color:var(--bg)">① Thông tin</span>
      <span style="color:var(--faint)">→</span>
      <span class="px-2.5 py-1 rounded-full" style="background:var(--raised);color:var(--subtle)">② Thanh toán</span>
      <span style="color:var(--faint)">→</span>
      <span class="px-2.5 py-1 rounded-full" style="background:var(--raised);color:var(--subtle)">③ Hoàn tất</span>
    </div>

    <!-- Security badge -->
    <div class="flex items-center gap-1.5 font-mono text-xs" style="color:var(--subtle)">
      <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M6 1L2 3v3.5C2 9 3.6 10.5 6 11c2.4-.5 4-2 4-4.5V3L6 1z" stroke="var(--accent)" stroke-width="1.2" stroke-linejoin="round"/></svg>
      Bảo mật SSL
    </div>

  </div>
</header>
