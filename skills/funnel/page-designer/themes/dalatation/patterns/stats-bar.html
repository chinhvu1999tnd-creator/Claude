<!--
  OVERRIDE: stats-bar.html — Dalatation
  vs shared: generic stats row with brand accent colors
  Override: FLAT SURFACE — no glow, no shadow, no gradients; clean horizontal strip on var(--surface)
  Layout: 4 equal columns separated by 1px var(--faint) dividers
  Visual: Large amber/pine numbers in DM Mono, subtle labels in var(--subtle)
  Key differences: alternating --amber / --accent coloring on numbers; zero elevation
-->

<section class="w-full" style="background:var(--surface);border-top:1px solid var(--faint);border-bottom:1px solid var(--faint)">
  <div class="max-w-5xl mx-auto px-6">
    <div class="grid grid-cols-2 md:grid-cols-4 divide-y md:divide-y-0 divide-x-0 md:divide-x"
         style="--tw-divide-opacity:1;border-color:var(--faint)">

      <!-- Stat 1: Tổng lượt khách -->
      <div class="flex flex-col items-center justify-center py-10 px-6 gap-2 text-center"
           style="border-right:1px solid var(--faint)">
        <span class="font-mono font-bold text-4xl leading-none tracking-tight"
              style="color:var(--amber);font-family:'DM Mono',monospace">[N]+</span>
        <span class="text-sm uppercase tracking-widest mt-1"
              style="color:var(--subtle);font-family:'DM Sans',sans-serif">Tổng lượt khách</span>
      </div>

      <!-- Stat 2: Năm kinh nghiệm -->
      <div class="flex flex-col items-center justify-center py-10 px-6 gap-2 text-center"
           style="border-right:1px solid var(--faint)">
        <span class="font-mono font-bold text-4xl leading-none tracking-tight"
              style="color:var(--accent);font-family:'DM Mono',monospace">[YEARS]</span>
        <span class="text-sm uppercase tracking-widest mt-1"
              style="color:var(--subtle);font-family:'DM Sans',sans-serif">Năm kinh nghiệm</span>
      </div>

      <!-- Stat 3: Cabin sẵn sàng -->
      <div class="flex flex-col items-center justify-center py-10 px-6 gap-2 text-center"
           style="border-right:1px solid var(--faint)">
        <span class="font-mono font-bold text-4xl leading-none tracking-tight"
              style="color:var(--amber);font-family:'DM Mono',monospace">[N] cabins</span>
        <span class="text-sm uppercase tracking-widest mt-1"
              style="color:var(--subtle);font-family:'DM Sans',sans-serif">Cabin sẵn sàng</span>
      </div>

      <!-- Stat 4: Đánh giá trung bình -->
      <div class="flex flex-col items-center justify-center py-10 px-6 gap-2 text-center">
        <span class="font-mono font-bold text-4xl leading-none tracking-tight"
              style="color:var(--accent);font-family:'DM Mono',monospace">[RATING]/5</span>
        <span class="text-sm uppercase tracking-widest mt-1"
              style="color:var(--subtle);font-family:'DM Sans',sans-serif">Đánh giá trung bình</span>
      </div>

    </div>
  </div>
</section>
