<!--
  PATTERN: Announcement Bar
  Use: Above nav — flash sale / countdown / limited offer
  Brief: Layout=full-width flex center · Background=accent · Elements=text+countdown+CTA link
-->
<div class="w-full py-2.5 px-6 flex items-center justify-center gap-4 flex-wrap" style="background:var(--accent);">
  <p class="font-display font-bold text-accent-text text-sm">[OFFER TEXT — e.g. 🔥 Giảm 68% — Chỉ còn hôm nay]</p>
  <div class="flex items-center gap-1.5 font-mono text-sm font-bold text-accent-text">
    <span id="ab-hrs" class="bg-black/15 px-2 py-0.5 rounded">08</span>:
    <span id="ab-min" class="bg-black/15 px-2 py-0.5 rounded">47</span>:
    <span id="ab-sec" class="bg-black/15 px-2 py-0.5 rounded">33</span>
  </div>
  <a href="order.html" class="font-display font-bold text-accent-text text-sm underline underline-offset-2 hover:opacity-75 transition-opacity">Đăng ký ngay →</a>
</div>
