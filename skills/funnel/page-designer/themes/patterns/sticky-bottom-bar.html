<!--
  sticky-bottom-bar.html — Fixed bottom CTA bar (mobile-first)
  Layout:     fixed bottom · full width · flex row · px-4 py-3
  Background: surface · border top rim · backdrop blur
  Elements:   price summary (left) · CTA button (right) · show after scroll threshold
  Visuals:    glass backdrop · accent CTA button
-->
<!-- Sticky bottom bar — paste at end of <body> -->
<div id="sticky-bar" class="fixed bottom-0 left-0 right-0 z-50 transition-transform duration-300 translate-y-full" style="border-top:1px solid rgba(255,255,255,0.08);backdrop-filter:blur(16px);background:rgba(20,20,19,0.92)">
  <div class="max-w-4xl mx-auto px-4 py-3 flex items-center gap-4">
    <div class="flex-1 min-w-0">
      <p class="text-ink text-sm font-medium leading-none">Tên Khóa Học</p>
      <p class="text-subtle text-xs mt-0.5">
        <span class="line-through mr-1.5">2.997K</span>
        <span style="color:var(--accent)" class="font-mono font-bold">997.000đ</span>
      </p>
    </div>
    <a href="#checkout" class="btn-glow shrink-0 flex items-center gap-1.5 py-2.5 px-5 rounded-btn font-display font-black text-sm" style="background:var(--accent);color:var(--bg)">
      Đăng ký ngay
      <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M2.5 6h7M6 3l3 3-3 3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>
  </div>
</div>

<script>
(function() {
  const bar = document.getElementById('sticky-bar');
  let shown = false;
  window.addEventListener('scroll', function() {
    const threshold = window.innerHeight * 0.8;
    if (window.scrollY > threshold && !shown) {
      bar.classList.remove('translate-y-full');
      shown = true;
    } else if (window.scrollY <= threshold && shown) {
      bar.classList.add('translate-y-full');
      shown = false;
    }
  }, { passive: true });
})();
</script>
