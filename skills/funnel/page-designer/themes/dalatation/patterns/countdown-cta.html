<!-- PATTERN: countdown-cta | Theme: Dalatation | OVERRIDE — Availability calendar (NOT a countdown timer). Shows next 14 days of cabin availability. Weekdays mostly open, weekends mostly full. -->

        available  → pine green dot + green text "Trống"
        full       → red dot dimmed + subtle text "Đầy"
        few        → amber dot + amber text "Ít phòng"

      Realistic pattern (today = Monday, May 12 2026):
        Mon 12 – available   (today)
        Tue 13 – available
        Wed 14 – available
        Thu 15 – available
        Fri 16 – few         (weekend approaching)
        Sat 17 – full
        Sun 18 – full
        Mon 19 – available
        Tue 20 – available
        Wed 21 – available
        Thu 22 – available
        Fri 23 – few
        Sat 24 – full
        Sun 25 – full
