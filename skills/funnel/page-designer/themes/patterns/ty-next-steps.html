<!--
  ty-next-steps.html — What to do next (numbered steps)
  Layout:     centered · max-w-xl · vertical step list
  Elements:   Section label · 3–4 numbered steps · Each: icon + title + description
  Rule:       Tối đa 4 bước — nhiều hơn gây overwhelm. Bước 1 phải là hành động ngay lập tức.
  Dùng cho:   Post-purchase · Webinar registration
-->
<div class="max-w-xl mx-auto px-6 pb-10">

  <p class="font-mono text-[11px] uppercase tracking-wider text-center mb-6" style="color:var(--subtle);letter-spacing:.12em">
    Bước tiếp theo của bạn
  </p>

  <div class="space-y-3">

    <!-- Step 1 -->
    <div class="flex items-start gap-4 rounded-xl p-4" style="background:var(--surface);border:1px solid rgba(var(--accent-rgb),.15)">
      <div class="shrink-0 w-8 h-8 rounded-lg flex items-center justify-center font-mono font-black text-sm"
        style="background:rgba(var(--accent-rgb),.12);color:var(--accent);border:1px solid rgba(var(--accent-rgb),.25)">1</div>
      <div>
        <p class="font-body font-semibold text-sm text-ink mb-0.5">[Bước 1 — hành động ngay lập tức]</p>
        <p class="font-body text-xs leading-relaxed" style="color:var(--body)">[Mô tả cụ thể, 1 câu. VD: "Mở email và nhấn link truy cập — đăng nhập bằng email này."]</p>
      </div>
    </div>

    <!-- Step 2 -->
    <div class="flex items-start gap-4 rounded-xl p-4" style="background:var(--surface);border:1px solid var(--rim)">
      <div class="shrink-0 w-8 h-8 rounded-lg flex items-center justify-center font-mono font-black text-sm"
        style="background:var(--raised);color:var(--subtle);border:1px solid var(--rim)">2</div>
      <div>
        <p class="font-body font-semibold text-sm text-ink mb-0.5">[Bước 2]</p>
        <p class="font-body text-xs leading-relaxed" style="color:var(--body)">[Mô tả cụ thể]</p>
      </div>
    </div>

    <!-- Step 3 -->
    <div class="flex items-start gap-4 rounded-xl p-4" style="background:var(--surface);border:1px solid var(--rim)">
      <div class="shrink-0 w-8 h-8 rounded-lg flex items-center justify-center font-mono font-black text-sm"
        style="background:var(--raised);color:var(--subtle);border:1px solid var(--rim)">3</div>
      <div>
        <p class="font-body font-semibold text-sm text-ink mb-0.5">[Bước 3]</p>
        <p class="font-body text-xs leading-relaxed" style="color:var(--body)">[Mô tả cụ thể]</p>
      </div>
    </div>

    <!-- [OPTIONAL: Step 4] — uncomment nếu cần bước thứ 4
    <div class="flex items-start gap-4 rounded-xl p-4" style="background:var(--surface);border:1px solid var(--rim)">
      <div class="shrink-0 w-8 h-8 rounded-lg flex items-center justify-center font-mono font-black text-sm"
        style="background:var(--raised);color:var(--subtle);border:1px solid var(--rim)">4</div>
      <div>
        <p class="font-body font-semibold text-sm text-ink mb-0.5">[Bước 4]</p>
        <p class="font-body text-xs leading-relaxed" style="color:var(--body)">[Mô tả cụ thể]</p>
      </div>
    </div>
    END [OPTIONAL] -->

  </div>
</div>
