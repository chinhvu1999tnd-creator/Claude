<!--
  OVERRIDE: stats-bar.html — Warm Earth
  vs shared: dark raised cards + neon glow
  Override: warm beige card blocks + terracotta/green numbers + organic icon
-->
<section class="py-10" style="background:var(--surface)">
  <div class="max-w-4xl mx-auto px-6">
    <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">

      <div class="rounded-xl p-5 text-center" style="background:var(--bg);border:1.5px solid var(--faint);box-shadow:0 2px 10px rgba(42,31,20,0.06)">
        <p class="font-mono font-bold leading-none mb-1.5" style="font-size:clamp(1.75rem,4vw,2.25rem);color:var(--accent)">[STAT 1]</p>
        <p class="font-body text-sm" style="color:var(--subtle)">[Label 1]</p>
      </div>

      <div class="rounded-xl p-5 text-center" style="background:var(--bg);border:1.5px solid var(--faint);box-shadow:0 2px 10px rgba(42,31,20,0.06)">
        <p class="font-mono font-bold leading-none mb-1.5" style="font-size:clamp(1.75rem,4vw,2.25rem);color:var(--green)">[STAT 2]</p>
        <p class="font-body text-sm" style="color:var(--subtle)">[Label 2]</p>
      </div>

      <div class="rounded-xl p-5 text-center" style="background:var(--bg);border:1.5px solid var(--faint);box-shadow:0 2px 10px rgba(42,31,20,0.06)">
        <p class="font-mono font-bold leading-none mb-1.5" style="font-size:clamp(1.75rem,4vw,2.25rem);color:var(--accent)">[STAT 3]</p>
        <p class="font-body text-sm" style="color:var(--subtle)">[Label 3]</p>
      </div>

      <div class="rounded-xl p-5 text-center" style="background:var(--bg);border:1.5px solid var(--faint);box-shadow:0 2px 10px rgba(42,31,20,0.06)">
        <p class="font-mono font-bold leading-none mb-1.5" style="font-size:clamp(1.75rem,4vw,2.25rem);color:var(--sand)">[STAT 4]</p>
        <p class="font-body text-sm" style="color:var(--subtle)">[Label 4]</p>
      </div>

    </div>
  </div>
</section>
