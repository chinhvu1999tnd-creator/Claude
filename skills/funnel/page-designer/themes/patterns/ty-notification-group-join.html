<!--
  ty-notification-group-join.html — Join Zalo group / chatbot for reminders & updates
  Layout:     centered · max-w-xl · card với Zalo primary + optional calendar secondary
  Elements:   Zalo group CTA (primary) · Zalo OA chatbot option · [OPTIONAL] calendar add links
  Rule:       Zalo là kênh nhắc nhở ưu tiên ở VN — hiện thị nổi, to, rõ
              Calendar add là phụ — để bên dưới, nhỏ hơn
  Dùng cho:   Webinar · Event · Booking Call — thay thế ty-calendar-add
-->
<div class="max-w-xl mx-auto px-6 pb-8">
  <div class="rounded-xl p-6" style="background:var(--surface);border:1px solid var(--rim)">

    <p class="font-mono text-[11px] uppercase tracking-wider mb-1" style="color:var(--subtle);letter-spacing:.12em">
      Đừng bỏ lỡ buổi này
    </p>
    <h3 class="font-display font-bold text-ink mb-1.5" style="font-size:1.125rem;letter-spacing:-0.015em">
      Tham gia nhóm để nhận nhắc nhở
    </h3>
    <p class="font-body text-sm mb-5" style="color:var(--body);line-height:1.6">
      Nhóm Zalo sẽ gửi nhắc nhở trước buổi và tài liệu chuẩn bị —
      không lo quên giờ hay bỏ lỡ update.
    </p>

    <!-- Primary: Zalo Group -->
    <a href="[ZALO_GROUP_URL]" target="_blank"
      class="btn-glow flex items-center gap-3 w-full py-3.5 px-5 rounded-btn font-display font-bold text-sm mb-3"
      style="background:rgba(var(--cyan-rgb),.12);color:var(--cyan);border:1px solid rgba(var(--cyan-rgb),.3);text-decoration:none">
      <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
        <rect x="2" y="2" width="18" height="18" rx="5" stroke="currentColor" stroke-width="1.4"/>
        <path d="M7 15V10a4 4 0 018 0v5M7 12h8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
      </svg>
      <span class="flex-1 text-left">Vào nhóm Zalo nhận nhắc nhở</span>
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
        <path d="M3 7h8M8 4l3 3-3 3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </a>

    <!-- [OPTIONAL: Zalo OA Chatbot] — uncomment nếu dùng chatbot thay group
    <a href="[ZALO_OA_URL]" target="_blank"
      class="flex items-center gap-3 w-full py-3 px-5 rounded-btn font-mono text-[11px] mb-3 transition-colors"
      style="background:var(--raised);color:var(--cyan);border:1px solid rgba(var(--cyan-rgb),.2);text-decoration:none">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
        <rect x="1" y="1" width="14" height="14" rx="4" stroke="currentColor" stroke-width="1.2"/>
        <path d="M5 8.5l1.5 1.5 4-4" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Hoặc nhắn tin Zalo OA để nhận nhắc nhở tự động
    </a>
    END [OPTIONAL: Zalo OA Chatbot] -->

    <!-- Divider -->
    <div class="flex items-center gap-3 my-4">
      <div class="flex-1 h-px" style="background:var(--rim)"></div>
      <span class="font-mono text-[10px]" style="color:var(--faint)">thêm vào lịch</span>
      <div class="flex-1 h-px" style="background:var(--rim)"></div>
    </div>

    <!-- Secondary: Calendar add (optional, nhỏ hơn) -->
    <div class="flex gap-2">
      <a href="[GOOGLE_CALENDAR_URL]" target="_blank"
        class="flex-1 flex items-center justify-center gap-1.5 py-2 px-3 rounded-lg font-mono text-[10px] transition-colors"
        style="background:var(--raised);color:var(--subtle);border:1px solid var(--rim);text-decoration:none">
        <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
          <rect x="1" y="2" width="10" height="9" rx="1.5" stroke="currentColor" stroke-width="1"/>
          <path d="M1 5h10M4 1v2M8 1v2" stroke="currentColor" stroke-width="1" stroke-linecap="round"/>
        </svg>
        Google Calendar
      </a>
      <a href="[ICAL_URL]" target="_blank"
        class="flex-1 flex items-center justify-center gap-1.5 py-2 px-3 rounded-lg font-mono text-[10px] transition-colors"
        style="background:var(--raised);color:var(--subtle);border:1px solid var(--rim);text-decoration:none">
        <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
          <rect x="1" y="2" width="10" height="9" rx="1.5" stroke="currentColor" stroke-width="1"/>
          <path d="M1 5h10M4 1v2M8 1v2" stroke="currentColor" stroke-width="1" stroke-linecap="round"/>
        </svg>
        iCal / Outlook
      </a>
    </div>

  </div>
</div>
