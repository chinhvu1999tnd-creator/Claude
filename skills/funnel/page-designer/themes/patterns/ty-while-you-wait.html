<!--
  ty-while-you-wait.html — Soft pitch to main offer (lead magnet thank you)
  Layout:     centered · max-w-xl · teaser card
  Elements:   "Trong khi chờ" label · Offer teaser · Soft CTA link (không phải button lớn)
  Rule:       KHÔNG push hard — đây là bridge nhẹ, không phải sales pitch
              CTA phải là link text hoặc ghost button, không phải neon accent button
              Người dùng chưa warm up đủ — chỉ plant seed, không close
  Dùng cho:   Lead magnet thank you — section cuối, sau ty-social-follow
-->
<div class="max-w-xl mx-auto px-6 pb-12">

  <div class="rounded-xl p-6" style="background:var(--surface);border:1px solid var(--rim)">

    <p class="font-mono text-[10px] uppercase tracking-wider mb-3" style="color:var(--subtle);letter-spacing:.12em">
      Trong khi chờ email
    </p>

    <h3 class="font-display font-bold text-ink mb-2" style="font-size:1.125rem;letter-spacing:-0.015em">
      Anh/chị đang gặp vấn đề gì với [chủ đề chính]?
    </h3>

    <p class="font-body text-sm mb-4" style="color:var(--body);line-height:1.7">
      [2–3 câu bridge: "Nếu [vấn đề], thì [tên sản phẩm chính] sẽ giúp anh/chị [kết quả cụ thể]. Nhiều người đã [kết quả bằng chứng] sau [thời gian]."]
    </p>

    <!-- Soft CTA — ghost, không neon -->
    <a href="[MAIN_OFFER_URL]"
      class="inline-flex items-center gap-1.5 font-body text-sm font-semibold transition-opacity hover:opacity-70"
      style="color:var(--accent);text-decoration:none">
      Tìm hiểu thêm về [Tên sản phẩm]
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
        <path d="M3 7h8M8 4l3 3-3 3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </a>

  </div>

</div>
