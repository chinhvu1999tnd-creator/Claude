<!--
  OVERRIDE: announcement-bar.html — Bright Learn
  vs shared: neon lime bg + dark strip
  Override: orange bg + white text + live dot — urgency màu ấm cho education
  Layout: tương tự shared — full-width flex center
-->
<div class="relative w-full py-2.5 px-6 flex items-center justify-center gap-3 flex-wrap overflow-hidden"
     style="background:var(--orange)">
  <!-- Subtle dot pattern overlay -->
  <div class="absolute inset-0 pointer-events-none opacity-10"
       style="background-image:radial-gradient(circle,rgba(255,255,255,0.8) 1px,transparent 1px);background-size:20px 20px"></div>
  <div class="relative flex items-center gap-2">
    <span class="relative flex h-2 w-2 flex-shrink-0">
      <span class="absolute inline-flex h-full w-full rounded-full bg-white opacity-75 animate-ping"></span>
      <span class="relative inline-flex h-2 w-2 rounded-full bg-white"></span>
    </span>
    <p class="font-display font-bold text-sm text-white">[OFFER TEXT — e.g. 🔥 Khai giảng Thứ 2 — Còn <strong>23 suất</strong> học phí ưu đãi]</p>
  </div>
  <div class="flex items-center gap-1 font-mono text-xs font-bold text-white">
    <span class="bg-white/20 px-2 py-0.5 rounded-md" id="ab-hrs">08</span>:
    <span class="bg-white/20 px-2 py-0.5 rounded-md" id="ab-min">47</span>:
    <span class="bg-white/20 px-2 py-0.5 rounded-md" id="ab-sec">33</span>
  </div>
  <a href="[CTA_URL]" class="font-display font-bold text-sm text-white underline underline-offset-2 hover:opacity-80 transition-opacity">Đăng ký ngay →</a>
</div>
