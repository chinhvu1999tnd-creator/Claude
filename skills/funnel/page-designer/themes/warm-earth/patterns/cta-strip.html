<!--
  OVERRIDE: cta-strip.html — Warm Earth
  vs shared: neon blobs + dark-on-neon
  Override: terracotta bg + linen texture + organic leaf shapes + warm CTA
-->
<section class="relative py-20 overflow-hidden" style="background:var(--accent)">
  <!-- Linen texture -->
  <div class="absolute inset-0 pointer-events-none"
       style="background-image:repeating-linear-gradient(45deg,rgba(255,255,255,0.04) 0px,rgba(255,255,255,0.04) 1px,transparent 1px,transparent 10px)"></div>
  <!-- Organic leaf decorations -->
  <svg class="absolute top-0 left-0 pointer-events-none opacity-20" width="120" height="120" viewBox="0 0 120 120" fill="none">
    <path d="M10 110C10 110 20 60 50 40C80 20 110 40 100 80C90 105 65 115 30 110" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.3)" stroke-width="1.5" stroke-linecap="round"/>
  </svg>
  <svg class="absolute bottom-0 right-0 pointer-events-none opacity-20" width="100" height="100" viewBox="0 0 100 100" fill="none">
    <path d="M90 10C90 10 80 50 55 65C30 80 10 65 20 35C28 12 55 5 90 10" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.3)" stroke-width="1.5" stroke-linecap="round"/>
  </svg>

  <div class="relative max-w-2xl mx-auto px-6 text-center">

    <!-- Leaf divider -->
    <div class="flex items-center justify-center gap-3 mb-5">
      <div class="h-px w-12" style="background:rgba(255,255,255,0.3)"></div>
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
        <path d="M3 17C3 17 6 9 10 7C14 5 17 8.5 16 13C15 16 12 17.5 8 17" stroke="rgba(255,255,255,0.7)" stroke-width="1.5" stroke-linecap="round"/>
        <path d="M8 17L7 14" stroke="rgba(255,255,255,0.7)" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      <div class="h-px w-12" style="background:rgba(255,255,255,0.3)"></div>
    </div>

    <p class="font-body font-semibold text-xs uppercase tracking-wider mb-4" style="color:rgba(255,255,255,0.75)">[Label — e.g. Giao hàng toàn quốc]</p>

    <h2 class="font-display font-extrabold text-white mb-4"
        style="font-size:clamp(1.75rem,4.5vw,3rem);line-height:1.08;letter-spacing:-0.02em">
      [CTA Headline]
    </h2>

    <p class="font-body text-base mb-8" style="color:rgba(255,255,255,0.82)">[Sub — 1 câu ấm áp, thân thiện]</p>

    <div class="flex flex-col sm:flex-row items-center justify-center gap-4 mb-8">
      <a href="[ORDER_URL]"
         class="inline-flex items-center gap-2 py-3.5 px-10 font-display font-bold text-sm transition-all hover:opacity-90"
         style="background:var(--bg);color:var(--accent);border-radius:8px;box-shadow:0 4px 16px rgba(42,31,20,0.20)">
        [CTA TEXT] →
      </a>
      <p class="font-body text-sm" style="color:rgba(255,255,255,0.65)">[Urgency — e.g. Chỉ còn [N] hộp tuần này]</p>
    </div>

    <!-- Trust notes -->
    <div class="flex items-center justify-center gap-5" style="opacity:0.7">
      <span class="font-body text-xs text-white">🌿 100% tự nhiên</span>
      <span class="w-px h-3 bg-white opacity-40"></span>
      <span class="font-body text-xs text-white">🚚 Ship toàn quốc</span>
      <span class="w-px h-3 bg-white opacity-40"></span>
      <span class="font-body text-xs text-white">🔄 Đổi trả trong [N] ngày</span>
    </div>

  </div>
</section>
