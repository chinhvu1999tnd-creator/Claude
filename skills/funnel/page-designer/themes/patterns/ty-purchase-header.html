<!--
  ty-purchase-header.html — Post-purchase confirmation header
  Layout:     centered · max-w-2xl · accent glow top
  Elements:   Checkmark animation · "Đặt hàng thành công" · Order summary · Email notice
  Rule:       CTA truy cập sản phẩm phải xuất hiện ngay trong trang này (ty-access.html bên dưới)
              Không để người mua phải tìm — giải quyết buyer's remorse ngay lập tức
-->
<div class="relative text-center py-14 px-6 overflow-hidden">

  <!-- Top glow -->
  <div class="absolute top-0 left-1/2 -translate-x-1/2 w-[480px] h-56 pointer-events-none"
    style="background:radial-gradient(ellipse,rgba(var(--accent-rgb),.14) 0%,transparent 70%);filter:blur(40px)"></div>

  <div class="relative max-w-xl mx-auto">

    <!-- Animated checkmark -->
    <div class="w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-6"
      style="background:rgba(var(--accent-rgb),.12);border:1.5px solid rgba(var(--accent-rgb),.3)">
      <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
        <path d="M7 14l5 5 9-9" stroke="var(--accent)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>

    <!-- Headline -->
    <h1 class="font-display font-black text-ink mb-2"
      style="font-size:clamp(1.75rem,4vw,2.5rem);line-height:1.1;letter-spacing:-0.03em">
      Đặt hàng thành công!
    </h1>
    <p class="font-body mb-8" style="color:var(--body);font-size:1.0625rem;line-height:1.7">
      Cảm ơn anh/chị. Link truy cập đang được gửi về email —<br>
      thường đến trong vòng <strong class="text-ink">2–5 phút</strong>.
    </p>

    <!-- Order summary pill -->
    <div class="inline-flex flex-col sm:flex-row items-center gap-3 px-5 py-4 rounded-xl text-left"
      style="background:var(--surface);border:1px solid var(--rim-strong)">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-lg flex items-center justify-center shrink-0"
          style="background:rgba(var(--accent-rgb),.10);border:1px solid rgba(var(--accent-rgb),.2)">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
            <path d="M2 4h12l-1 8H3L2 4z" stroke="var(--accent)" stroke-width="1.3" stroke-linejoin="round"/>
            <path d="M6 4V3a2 2 0 014 0v1" stroke="var(--accent)" stroke-width="1.3" stroke-linecap="round"/>
          </svg>
        </div>
        <div>
          <p class="font-body font-semibold text-sm text-ink">[Tên sản phẩm]</p>
          <p class="font-mono text-[10px]" style="color:var(--subtle)">Mã đơn: [ORDER_ID]</p>
        </div>
      </div>
      <div class="sm:ml-auto text-right">
        <p class="font-mono font-black text-sm" style="color:var(--accent)">[Giá tiền]</p>
        <p class="font-mono text-[10px]" style="color:var(--subtle)">Đã xác nhận</p>
      </div>
    </div>

    <!-- Email notice -->
    <p class="font-mono text-[11px] mt-5" style="color:var(--subtle)">
      Kiểm tra hộp thư <strong class="text-ink">[email@example.com]</strong> · Nếu không thấy, xem thư mục Spam
    </p>

  </div>
</div>
